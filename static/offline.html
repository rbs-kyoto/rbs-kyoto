<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f5f7">
    <title>オフラインです｜rbs京都</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 100%;
            color: #620610;
            background: #f3f5f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 2rem;
            place-items: center;
            background: #f3f5f7;
        }

        main {
            width: min(50rem, 100%);
            margin: auto;
            text-align: center;
        }

        .error-heading {
            position: relative;
            padding: 0 3rem 1rem;
        }

        .error-heading::after {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            height: .1rem;
            transform-origin: left center;
            background: #620610;
            animation: underline .8s ease-in-out .3s both;
            content: "";
        }

        @keyframes underline {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        .offline-icon {
            display: block;
            width: 2.5rem;
            height: 2.5rem;
            margin: 0 auto 1rem;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2.5;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .error-code {
            margin: .75rem 0 0;
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .error-code span {
            display: block;
            color: #91515c;
            font-size: .9rem;
            font-weight: 400;
        }

        .guidance {
            margin: 2.25rem 0 0;
            font-size: 1rem;
            line-height: 1.8;
        }

        button {
            min-height: 2.75rem;
            margin-top: 1.25rem;
            padding: .65rem 1.1rem;
            border: .1rem solid #620610;
            border-radius: .6rem;
            background: #620610;
            color: #fff;
            font: inherit;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #803845;
        }

        button:focus-visible {
            outline: .15rem solid #91515c;
            outline-offset: .15rem;
        }

        .logo {
            display: block;
            width: 5.5rem;
            max-width: 35%;
            height: auto;
            margin: 2.5rem auto 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 1.25rem;
            }

            .error-heading {
                padding-right: 1rem;
                padding-left: 1rem;
            }

            h1 {
                font-size: 1.3rem;
            }

            .guidance {
                margin-top: 1.75rem;
                font-size: .95rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .error-heading::after {
                transform: scaleX(1);
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <header class="error-heading">
            <svg class="offline-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path d="M5 17.5a30 30 0 0 1 38 0"></path>
                <path d="M11 24a20 20 0 0 1 11.5-5.8M25.5 18.2A20 20 0 0 1 37 24"></path>
                <path d="M17 30a11 11 0 0 1 6-3.2M25 26.8a11 11 0 0 1 6 3.2"></path>
                <path d="M23.5 37h1"></path>
                <path d="M7 7l34 34"></path>
            </svg>
            <h1>インターネットに接続できません</h1>
        </header>
        <p class="error-code">OFFLINE<span>接続エラー</span></p>
        <p class="guidance">
            ネットワークの接続を確認してから、もう一度お試しください。
        </p>
        <button type="button" onclick="location.reload()">再読み込み</button>
    </main>
</body>
</html>
