<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f5f7">
    <title>オフラインです｜rbs京都</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 100%;
            color: #620610;
            background: #f3f5f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 2rem;
            place-items: center;
            background: #f3f5f7;
        }

        main {
            width: min(40rem, 100%);
            padding: 3rem;
            border: .1rem solid #e2cdcf;
            border-radius: 1.5rem;
            corner-shape: superellipse(1.4);
            background: #fff;
            box-shadow: 0 0 1.5rem rgb(0 0 0 / 8%);
            text-align: center;
        }

        .offline-icon {
            display: block;
            width: 3rem;
            height: 3rem;
            margin: 0 auto 1rem;
            fill: #620610;
        }

        h1 {
            margin: 0;
            color: #620610;
            font-size: 1.8rem;
            line-height: 1.4;
        }

        p {
            margin: 1rem 0 0;
            color: #5b5658;
            font-size: 1rem;
            line-height: 1.8;
        }

        button {
            min-height: 2.75rem;
            margin-top: 1.5rem;
            padding: .65rem 1.25rem;
            border: .1rem solid #620610;
            border-radius: .6rem;
            corner-shape: superellipse(1.4);
            background: #620610;
            color: #fff;
            font: inherit;
            font-size: .95rem;
            cursor: pointer;
        }

        button:focus-visible {
            outline: .15rem solid #91515c;
            outline-offset: .15rem;
        }

        @media (max-width: 1024px) {
            :root {
                font-size: 90%;
            }
        }

        @media (max-width: 600px) {
            :root {
                font-size: 87.5%;
            }

            body {
                padding: 1rem;
            }

            main {
                padding: 1.75rem 1.25rem;
                border-radius: 1rem;
                corner-shape: superellipse(1.3);
            }
        }
    </style>
</head>
<body>
    <main>

        </svg>
        <h1>インターネットに接続できません</h1>
        <p>
            ネットワークの接続を確認してから、もう一度お試しください。
        </p>
        <button type="button" onclick="location.reload()">再読み込み</button>
    </main>
</body>
</html>
