<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7f9">
    <title>一時的に接続できません｜rbs京都</title>
    <style>
        html {
            font-size: 100%;
        }

        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #302b2c;
            background: #f3f5f7;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 2rem;
            place-items: center;
            background: #f3f5f7;
        }

        main {
            width: min(100%, 58rem);
            padding: 3.5rem;
            border: .1rem solid #e2cdcf;
            border-radius: 1.5rem;
            corner-shape: superellipse(1.4);
            background: #fff;
            box-shadow: 0 0 1.5rem rgb(0 0 0 / 8%);
            text-align: left;
        }

        .status {
            margin: 0 0 1rem;
            color: #91515c;
            font-size: .9rem;
            font-weight: 700;
        }

        h1 {
            margin: 0;
            color: #620610;
            font-size: 2.1rem;
            line-height: 1.4;
        }

        p {
            max-width: 42rem;
            margin: 1rem 0 0;
            color: #5b5658;
            font-size: 1rem;
            line-height: 1.9;
        }

        img {
            display: block;
            width: 5.5rem;
            max-width: 35%;
            height: auto;
            margin: 2rem auto 0;
        }

        @media (max-width: 1024px) {
            html {
                font-size: 90%;
            }

            main {
                padding: 2.75rem;
            }

            h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 600px) {
            html {
                font-size: 87.5%;
            }

            body {
                padding: 1rem;
            }

            main {
                padding: 1.5rem;
                border-radius: 1rem;
                corner-shape: superellipse(1.3);
            }

            h1 {
                font-size: 1.8rem;
            }

            img {
                width: 4.75rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="status">システム復旧中</p>
        <h1>一時的に接続できません</h1>
        <p>
            現在、システムの復旧を確認しています。<br>
            しばらく時間をおいてから、もう一度アクセスしてください。
        </p>
        <img src="/static/main/img/rbs.svg" alt="rbs京都">
    </main>
</body>
</html>
