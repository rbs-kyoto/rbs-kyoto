{% extends "main/base.html" %}
{% load static %}

{% block title %}パスワードを変更｜rbs京都{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'main/css/mypage.css' %}">{% endblock %}

{% block content %}
<section class="mypage-section">
    <div class="mypage-container">

        <header class="mypage-header">
            <h2>パスワードを変更</h2>
        </header>

        <section class="mypage-card">
            <form class="account-form" method="post" onsubmit="return confirm('パスワードを変更します。この操作は取り消せません。\n実行しますか？');">
                {% csrf_token %}

                {% if error %}
                    <div class="account-error">
                        {{ error }}
                    </div>
                {% endif %}

                <div class="account-field">
                    <label for="current_password">現在のパスワード</label>
                    <input
                        class="common-style"
                        type="password"
                        id="current_password"
                        name="current_password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <div class="account-field">
                    <label for="new_password">新しいパスワード</label>
                    <input
                        class="common-style"
                        type="password"
                        id="new_password"
                        name="new_password"
                        autocomplete="new-password"
                        required
                    >
                </div>
                <div class="account-field">
                    <label for="new_password_confirm">
                        新しいパスワード（確認）
                    </label>
                    <input
                        class="common-style"
                        type="password"
                        id="new_password_confirm"
                        name="new_password_confirm"
                        autocomplete="new-password"
                        required
                    >
                </div>
                <div class="account-form__footer">
                    <a class="page-control-style-back" href="{% url 'accounts:mypage' %}">
                        マイページへ
                    </a>
                    <button class="common-style" type="submit">
                        パスワードを変更
                    </button>
                </div>
            </form>
        </section>

    </div>
</section>
{% endblock %}
