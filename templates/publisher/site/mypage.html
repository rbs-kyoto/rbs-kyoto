{% extends "main/base.html" %}
{% load static %}

{% block title %}マイページ｜rbs京都{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'main/css/mypage.css' %}">{% endblock %}

{% block content %}

<section class="mypage-section">
    <div class="mypage-container">
        <header class="mypage-header">
            <h2>マイページ</h2>
        </header>
        <section class="mypage-card">
            <div class="mypage-card__header">
                <h3>プロフィール</h3>
            </div>
            <div class="mypage-info">
                <div class="mypage-info__item">
                    <span class="mypage-info__label">メールアドレス</span>
                    <span class="mypage-info__value">
                        {{ email_placeholder|safe }}
                    </span>
                </div>
            </div>
        </section>
        <section class="mypage-card">
            <div class="mypage-card__header">
                <h3>マニュアル</h3>
            </div>
            <div class="mypage-actions">
                <a href="{% url 'manuals:manual_list' %}">マニュアル一覧を見る</a>
            </div>
        </section>
        <section class="mypage-card">
            <div class="mypage-card__header">
                <h3>アカウント</h3>
            </div>
            <div class="mypage-actions">
                <a class="mypage-actions__logout" href="{% url 'accounts:logout' %}">ログアウト</a>
            </div>
        </section>
    </div>
</section>

{% endblock %}
