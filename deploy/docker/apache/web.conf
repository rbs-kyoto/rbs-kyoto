Listen 8080

# 公開サイト（静的に書き出したHTML + gate/）
<VirtualHost *:80>
    DocumentRoot /var/www/gate/public
    <Directory /var/www/gate/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        # 実在しないパスはすべて gate に渡す
        FallbackResource /index.php
    </Directory>

    # 静的ファイルとメディアは、公開中のバージョンから Apache が直接返す
    Alias /static/ /srv/site/current/static/
    Alias /media/ /srv/site/current/media/
    <Directory /srv/site>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <LocationMatch "^/(static|media)/">
        Header set X-Content-Type-Options "nosniff"
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# 管理画面（Django）と救出画面。Cloudflare Access で保護するホスト名をここに向ける
<VirtualHost *:8080>
    # 救出画面は Apache + PHP が直接返す。Django が止まっていても動く
    Alias /rescue/ /var/www/rescue/public/
    <Directory /var/www/rescue/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /rescue/index.php
    </Directory>

    # 編集画面のプレビューで使う画像（公開前のものも含む）
    Alias /media/ /srv/media/
    <Directory /srv/media>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyPass /rescue/ !
    ProxyPass /media/ !
    ProxyPass / http://admin:8000/
    ProxyPassReverse / http://admin:8000/
    # Cloudflare が付けた値を優先し、無ければ https として扱う
    RequestHeader setIfEmpty X-Forwarded-Proto "https"

    # Django に繋がらないとき（更新の失敗など）は、救出画面へ案内する。
    # コンテナが止まっていると名前が引けず、Apache は 502/503 ではなく 500 を返す。
    # Django 自身の 500 はそのまま通る（ProxyErrorOverride は使わない）
    ErrorDocument 502 /rescue/down.html
    ErrorDocument 503 /rescue/down.html
    ErrorDocument 504 /rescue/down.html
    <LocationMatch "^/(?!rescue/)">
        ErrorDocument 500 /rescue/down.html
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
