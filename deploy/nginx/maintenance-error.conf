# Include inside the site's server block.
# collectstatic must place maintenance-unavailable.html directly in STATIC_ROOT.
# Intercept only proxy failures; let Django's own 503 maintenance page pass through.
proxy_intercept_errors on;
error_page 502 504 =503 /maintenance-unavailable.html;

location = /maintenance-unavailable.html {
    root /srv/rbs-kyoto/staticfiles;
    internal;
}
