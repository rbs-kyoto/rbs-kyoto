# 管理画面（Django, SITE_ROLE=admin）
# cloudflared: rbs-poc-admin.clusters-prj.com -> http://10.2.1.14:8080（Accessで保護する）
Listen 8080

<VirtualHost *:8080>
    ServerName rbs-poc-admin.clusters-prj.com

    Alias /static/ /srv/rbs-kyoto/staticfiles/
    Alias /media/ /srv/rbs-kyoto/media/
    <Directory /srv/rbs-kyoto/staticfiles>
        Require all granted
    </Directory>
    <Directory /srv/rbs-kyoto/media>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /static/ !
    ProxyPass /media/ !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    # cloudflared からは http で届くので、Django には https として伝える
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/rbs-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/rbs-admin-access.log combined
</VirtualHost>
