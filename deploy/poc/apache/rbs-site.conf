# 公開サイト（静的書き出し + gate/）
# cloudflared: rbs-poc.clusters-prj.com -> http://10.2.1.14:80
<VirtualHost *:80>
    ServerName rbs-poc.clusters-prj.com

    DocumentRoot /srv/rbs-kyoto/gate/public
    <Directory /srv/rbs-kyoto/gate/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        # 実在しないパスはすべて gate に渡す
        FallbackResource /index.php
    </Directory>

    # 静的ファイルとメディアは公開中のバージョンから Apache が直接返す
    Alias /static/ /srv/rbs-site/current/static/
    Alias /media/ /srv/rbs-site/current/media/
    <Directory /srv/rbs-site>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <LocationMatch "^/(static|media)/">
        Header set X-Content-Type-Options "nosniff"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/rbs-site-error.log
    CustomLog ${APACHE_LOG_DIR}/rbs-site-access.log combined
</VirtualHost>
