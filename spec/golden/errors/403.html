
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f5f7">
    <title>アクセスできません｜rbs京都</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Noto+Sans+JP:wght@100..900&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="/static/main/css/error.css">
</head>
<body>
    <main>
        <header class="error-heading">
            <span class="error-heading__icon material-symbols-rounded" aria-hidden="true">gpp_bad</span>
            <h1>このページにはアクセスできません。</h1>
        </header>

        <p class="error-code">403<span>Forbidden</span></p>

        <section class="reasons" aria-labelledby="reasons-title">
            <h2 id="reasons-title">次のような理由が考えられます。</h2>
            <ul>
                
<li><span class="material-symbols-rounded" aria-hidden="true">lock</span>このページを表示する権限がない</li>
<li><span class="material-symbols-rounded" aria-hidden="true">login</span>ログインが必要なページである</li>
<li><span class="material-symbols-rounded" aria-hidden="true">block</span>アクセスが制限されている</li>

            </ul>
        </section>

        <p class="guidance">アカウントをご確認いただくか、管理者にお問い合わせください。</p>
        <nav class="navigation" aria-label="ページ移動">
            <a href="/">トップページへ戻る</a>
            <a href="/news/">News一覧を見る</a>
        </nav>
        <img class="logo" src="/static/main/img/rbs.svg" alt="rbs京都">
    </main>
</body>
</html>
