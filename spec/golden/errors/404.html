
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f5f7">
    <title>ページが見つかりません｜rbs京都</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Noto+Sans+JP:wght@100..900&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="/static/main/css/error.css">
</head>
<body>
    <main>
        <header class="error-heading">
            <span class="error-heading__icon material-symbols-rounded" aria-hidden="true">search_off</span>
            <h1>お探しのページが見つかりませんでした。</h1>
        </header>

        <p class="error-code">404<span>Not Found</span></p>

        <section class="reasons" aria-labelledby="reasons-title">
            <h2 id="reasons-title">次のような理由が考えられます。</h2>
            <ul>
                
<li><span class="material-symbols-rounded" aria-hidden="true">link_off</span>URLが間違っている</li>
<li><span class="material-symbols-rounded" aria-hidden="true">drive_file_move</span>ページが移動または削除された</li>
<li><span class="material-symbols-rounded" aria-hidden="true">event_busy</span>公開期間が終了している</li>

            </ul>
        </section>

        <p class="guidance">URLをご確認いただくか、下のリンクから目的のページをお探しください。</p>
        <nav class="navigation" aria-label="ページ移動">
            <a href="/">トップページへ戻る</a>
            <a href="/news/">News一覧を見る</a>
        </nav>
        <img class="logo" src="/static/main/img/rbs.svg" alt="rbs京都">
    </main>
</body>
</html>
