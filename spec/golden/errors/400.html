
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f5f7">
    <title>リクエストを処理できません｜rbs京都</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Noto+Sans+JP:wght@100..900&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="/static/main/css/error.css">
</head>
<body>
    <main>
        <header class="error-heading">
            <span class="error-heading__icon material-symbols-rounded" aria-hidden="true">sentiment_dissatisfied</span>
            <h1>リクエストを処理できませんでした。</h1>
        </header>

        <p class="error-code">400<span>Bad Request</span></p>

        <section class="reasons" aria-labelledby="reasons-title">
            <h2 id="reasons-title">次のような理由が考えられます。</h2>
            <ul>
                
<li><span class="material-symbols-rounded" aria-hidden="true">edit_note</span>入力された情報に誤りがある</li>
<li><span class="material-symbols-rounded" aria-hidden="true">rule</span>リクエストの形式が正しくない</li>
<li><span class="material-symbols-rounded" aria-hidden="true">event_busy</span>ページの有効期限が切れている</li>

            </ul>
        </section>

        <p class="guidance">入力内容をご確認のうえ、もう一度お試しください。</p>
        <nav class="navigation" aria-label="ページ移動">
            <a href="/">トップページへ戻る</a>
            <a href="/news/">News一覧を見る</a>
        </nav>
        <img class="logo" src="/static/main/img/rbs.svg" alt="rbs京都">
    </main>
</body>
</html>
