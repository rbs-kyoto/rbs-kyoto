    <script>
        try {
            const savedTheme = localStorage.getItem("rbs-theme");
            const useDarkTheme = savedTheme === "dark"
                || (savedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.body.classList.toggle("dark-mode", useDarkTheme);
        } catch (error) {
            console.warn("Theme preference could not be read from local storage.", error);
            document.body.classList.toggle(
                "dark-mode",
                window.matchMedia("(prefers-color-scheme: dark)").matches
            );
        }
    </script>

        </nav>

                <button class="theme-toggle__option" type="button" data-theme-mode="dark" aria-pressed="false">
